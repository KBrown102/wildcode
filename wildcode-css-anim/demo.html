<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>野马角色 · CSS动画预览</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A0C12;color:#E8E6E1;font-family:"Microsoft YaHei",sans-serif;min-height:100vh;overflow:hidden;
       background-image:linear-gradient(rgba(232,230,225,.045) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(232,230,225,.045) 1px,transparent 1px);
       background-size:48px 48px;}
  .title{position:fixed;top:22px;left:26px;font-size:13px;letter-spacing:.3em;color:#8A8F98;text-transform:uppercase}
  .title b{color:#FF6A3D}
  .note{position:fixed;bottom:16px;right:20px;font-size:12px;color:#8A8F98}
  /* pet 左下角 */
  #pet{position:fixed;left:26px;bottom:20px;width:120px;height:120px;
       background:url("assets/horses/yan.png") center/contain no-repeat;
       animation:petFloat 7s ease-in-out infinite;cursor:pointer}
  #pet:hover{animation-duration:4.5s}
  /* 五马排布在底部一线 */
  .row{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:56px;pointer-events:none}
  .horse{width:84px;height:96px;background-repeat:no-repeat;background-position:center bottom;background-size:contain}
  .h-free{background-image:url("assets/horses/shan.png");animation:horseRun 3.6s ease-in-out infinite alternate}
  .h-shy{background-image:url("assets/horses/ying.png");animation:horseShy 6.8s ease-in-out infinite}
  .h-happy{background-image:url("assets/horses/lv.png");animation:horseBounce 1.2s ease-in-out infinite}
  .h-lazy{background-image:url("assets/horses/zong.png");animation:horseLazy 5.6s ease-in-out infinite}
  .h-angry{background-image:url("assets/horses/lan.png");animation:horseAngry .85s ease-in-out infinite}
  .tag{position:fixed;bottom:118px;font-size:11px;color:#8A8F98;letter-spacing:.1em}
  .t-free{left:calc(50% - 210px)} .t-shy{left:calc(50% - 105px)} .t-happy{left:calc(50% - 15px)}
  .t-lazy{left:calc(50% + 85px)} .t-angry{left:calc(50% + 180px)}
  @keyframes petFloat{0%,100%{transform:translateY(0) rotate(0) scale(1)}25%{transform:translateY(-7px) rotate(-1.2deg) scale(1.02)}50%{transform:translateY(-2px) rotate(1deg)}75%{transform:translateY(-9px) rotate(-.6deg) scale(1.01)}}
  @keyframes horseRun{0%{transform:translateX(-42px) rotate(-5deg) scale(.98)}50%{transform:translateX(42px) rotate(5deg) scale(1.02)}100%{transform:translateX(-42px) rotate(-5deg) scale(.98)}}
  @keyframes horseShy{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-4px) scale(1.01)}55%{transform:translateY(-1px) scale(.965)}70%{transform:translateY(-5px) scale(1.005)}}
  @keyframes horseBounce{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-24px) scale(1.03,.97)}60%{transform:translateY(-6px) scale(.985,1.02)}}
  @keyframes horseLazy{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.025,.98)}}
  @keyframes horseAngry{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px) rotate(-1.4deg)}40%{transform:translate(2px,-1px) rotate(1.4deg)}60%{transform:translate(-1px,-1px) rotate(-.8deg)}80%{transform:translate(2px,1px) rotate(1deg)}}
  @media(max-width:640px){#pet{width:88px;height:88px}.horse{width:60px;height:72px}.row{gap:30px}}
</style>
</head>
<body>
<div class="title">WILD<b>CODE</b> · 野马角色 CSS 动画预览</div>
<div id="pet" title="点我开关音乐（示例）"></div>
<div class="row">
  <div class="horse h-free"></div>
  <div class="horse h-shy"></div>
  <div class="horse h-happy"></div>
  <div class="horse h-lazy"></div>
  <div class="horse h-angry"></div>
</div>
<span class="tag t-free">自由·闪电</span>
<span class="tag t-shy">害羞·粉樱</span>
<span class="tag t-happy">开心·绿叶</span>
<span class="tag t-lazy">懒·棕鬃</span>
<span class="tag t-angry">气·蓝衣</span>
<div class="note">左下角=眼镜野马（站长）· 深色底即网站 #0A0C12</div>
</body>
</html>
